<?xml version="1.0" encoding="UTF-8"?>
<!-- ztodo app icon: a green Zorro-style "Z" slash (the zterminal family mark)
     with a check badge. Rendered to assets/icons/ztodo-<size>.png by
     tools/render-icons.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23272a"/>
      <stop offset="1" stop-color="#0b0d0e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1f3a1f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ff7a"/>
      <stop offset="0.45" stop-color="#4fe03a"/>
      <stop offset="1" stop-color="#169a2a"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62e848"/>
      <stop offset="1" stop-color="#1c9f2e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="72" y="72" width="880" height="880" rx="196" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="72" y="72" width="880" height="880" rx="196" fill="url(#vignette)"/>
  <rect x="73.5" y="73.5" width="877" height="877" rx="194.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- the Z: one blade-shaped outline (thin tips, thick joints) -->
  <g filter="url(#glow)">
    <path fill="url(#blade)" d="
      M 214 352
      C 400 318, 610 282, 816 214
      C 690 380, 545 560, 432 690
      C 530 682, 620 672, 700 652
      C 560 730, 390 786, 196 818
      C 330 660, 470 500, 590 360
      C 470 350, 340 346, 214 352 Z"/>
    <!-- edge highlight along the blade -->
    <path fill="none" stroke="#eaffd6" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round" d="
      M 300 336 C 470 308, 640 276, 786 236"/>
    <path fill="none" stroke="#eaffd6" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round" d="
      M 766 262 C 660 400, 540 550, 450 660"/>
  </g>

  <!-- check badge -->
  <g transform="translate(782 782)">
    <circle r="96" fill="#0b0d0e"/>
    <circle r="78" fill="url(#badge)"/>
    <path d="M -36 2 L -10 28 L 40 -24" fill="none" stroke="#0b0d0e" stroke-width="20"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
