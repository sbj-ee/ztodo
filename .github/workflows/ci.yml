# Build, test and package ztodo on Ubuntu 24.04 (Linux amd64) and macOS 15
# (Apple Silicon). Artifacts: ztodo_<version>_amd64.deb, ztodo-<version>-Darwin.dmg.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the v* tags, for README "Current release"
      - name: Check version drift
        run: scripts/check-version.sh

  linux:
    name: Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev cmake ninja-build g++ dpkg-dev fonts-dejavu-core \
            libsodium-dev pkg-config

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZTODO_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          dpkg-deb -I ztodo_*_amd64.deb
          dpkg-deb -c ztodo_*_amd64.deb | grep -q './usr/bin/ztodo$'
          dpkg-deb -c ztodo_*_amd64.deb | grep -q './usr/share/applications/ztodo.desktop$'
          dpkg-deb -f ztodo_*_amd64.deb Depends | grep -q 'libsodium23'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ztodo-linux
          path: build/ztodo_*_amd64.deb
          if-no-files-found: error

  sanitize:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev cmake ninja-build g++ fonts-dejavu-core \
            libsodium-dev pkg-config

      # No ZTODO_WERROR here: GCC's sanitizer instrumentation causes false
      # -Wnull-dereference / -Wmaybe-uninitialized warnings. The linux job
      # already builds with -Werror.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DZTODO_SANITIZE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: Fuzz (libFuzzer, 2 min per target)
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 + clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev cmake ninja-build clang-18 libclang-rt-18-dev libsodium-dev pkg-config

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DZTODO_FUZZ=ON -DZTODO_SANITIZE=ON

      - name: Build
        run: cmake --build build --target fuzz_oplog fuzz_text fuzz_update

      # New inputs go to a scratch corpus; the checked-in seeds are read-only.
      # A crash, timeout or leak fails the job and its input is uploaded.
      - name: Fuzz
        run: |
          mkdir -p findings
          status=0
          for t in fuzz_oplog fuzz_text fuzz_update; do
            mkdir -p "work/$t"
            echo "::group::$t"
            build/fuzz/$t "work/$t" "fuzz/corpus/$t" \
              -max_total_time=120 -timeout=10 -rss_limit_mb=4096 \
              -artifact_prefix="findings/$t-" -print_final_stats=1 || status=1
            echo "::endgroup::"
          done
          exit $status

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: findings/
          if-no-files-found: ignore

  macos:
    name: macOS (macos-15, arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt + build tools (brew)
        run: brew install qt cmake ninja libsodium pkg-config

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZTODO_WERROR=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .dmg
        run: |
          cd build
          cpack -G DragNDrop
          ls -l ztodo-*-Darwin.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ztodo-macos
          path: build/ztodo-*-Darwin.dmg
          if-no-files-found: error
